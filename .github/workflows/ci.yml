# ci.yml - Continuous integration for The Onchain Architect
#
# WHAT: Runs the test suites for the three decoupled parts of the repo on every
#       push and pull request: Hardhat contracts, the Next.js frontend and the
#       FastAPI backend.
# WHY:  A green check on each commit shows reviewers and forkers that the
#       hashing, IFC validation, contract and verification logic still work.
# FILECOIN: No secrets are used. Backend tests mock Lighthouse and contract tests
#       run on Hardhat's in-memory network, so nothing touches Filecoin or costs FIL.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
